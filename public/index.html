<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disaster Location Report -ENA City-</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body>
<header>
  <h1>Disaster Location Report -ENA City-</h1>
</header>

<main>
  <section class="panel list-panel">
    <div class="list-header">
      <h2>Disaster List</h2>
      <button type="button" id="toggle-list" class="toggle-btn" aria-expanded="true">－ 折りたたむ</button>
    </div>

    <div id="list-body">
      <button type="button" id="open-new-report" class="primary-btn">＋ 新規登録</button>

      <div class="filter-bar">
        <span class="filter-label">表示：</span>
        <label><input type="checkbox" class="status-filter" value="未対応" checked> 未対応</label>
        <label><input type="checkbox" class="status-filter" value="対応中" checked> 対応中</label>
        <label><input type="checkbox" class="status-filter" value="対応済み"> 対応済み</label>
      </div>

      <table id="report-table">
        <thead>
          <tr>
            <th>No.</th>
            <th>報告時刻</th>
            <th>画像</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel map-panel">
    <h2>Map</h2>
    <div id="map"></div>
  </section>
</main>

<!-- 新規登録モーダル -->
<div id="new-report-modal" class="modal-overlay hidden">
  <div class="modal">
    <button type="button" class="modal-close" data-close="new-report-modal">×</button>
    <h2>新規報告</h2>
    <form id="report-form">
      <label>
        画像（位置情報付き写真）
        <input type="file" name="image" id="image-input" accept="image/*" required>
      </label>
      <p id="gps-status" class="hint"></p>

      <div id="manual-coords" class="manual-coords hidden">
        <label>緯度<input type="number" step="any" name="latitude" id="latitude-input"></label>
        <label>経度<input type="number" step="any" name="longitude" id="longitude-input"></label>
      </div>
      <button type="button" id="use-current-location" class="secondary-btn hidden">📍 現在地を取得して入力</button>
      <p id="location-status" class="hint"></p>

      <label>
        報告時刻
        <input type="datetime-local" name="reported_at" id="reported-at-input" required>
      </label>

      <label>
        被害情報
        <textarea name="damage_info" id="damage-info-input" rows="3" required placeholder="例：建物倒壊、道路冠水など"></textarea>
      </label>

      <label>
        対応状況
        <select name="status" id="status-input">
          <option value="未対応">未対応</option>
          <option value="対応中">対応中</option>
          <option value="対応済み">対応済み</option>
        </select>
      </label>

      <button type="submit" id="submit-button" class="primary-btn">報告を登録</button>
      <p id="form-message" class="hint"></p>
    </form>
  </div>
</div>

<!-- 詳細モーダル -->
<div id="detail-modal" class="modal-overlay hidden">
  <div class="modal">
    <button type="button" class="modal-close" data-close="detail-modal">×</button>
    <h2>Details</h2>
    <div id="detail-content"></div>

    <h3>対応状況の更新</h3>
    <form id="status-update-form">
      <label>
        新しい対応状況
        <select id="status-update-select">
          <option value="未対応">未対応</option>
          <option value="対応中">対応中</option>
          <option value="対応済み">対応済み</option>
        </select>
      </label>
      <label>
        メモ（任意）
        <textarea id="status-update-note" rows="2" placeholder="対応内容など"></textarea>
      </label>
      <button type="submit" class="primary-btn">対応状況を追加</button>
    </form>

    <h3>対応履歴</h3>
    <ul id="status-history-list"></ul>

    <button type="button" id="delete-report-btn" class="danger-btn">この報告を削除</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
