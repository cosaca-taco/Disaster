<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disaster Location Report</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body>
<header>
  <h1 id="site-title">Disaster Location Report</h1>
  <div id="user-info" class="user-info hidden">
    <button type="button" id="open-alert-modal" class="signout-btn" title="登録ユーザー全員にメールでお知らせを送信">📢 お知らせ送信</button>
    <span id="user-email"></span>
    <button type="button" id="signout-btn" class="signout-btn">サインアウト</button>
  </div>
</header>

<!-- ログイン画面 -->
<div id="auth-screen">
  <div class="auth-card">
    <h2>Disaster Location Report</h2>
    <p id="auth-subtitle" class="auth-subtitle"></p>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" data-tab="login">ログイン</button>
      <button type="button" class="auth-tab" data-tab="register">新規登録</button>
    </div>

    <!-- ログインフォーム -->
    <form id="login-form" class="auth-form">
      <label>メールアドレス
        <input type="email" id="login-email" required autocomplete="email">
      </label>
      <label>パスワード
        <input type="password" id="login-password" required autocomplete="current-password">
      </label>
      <button type="submit" class="primary-btn">ログイン</button>
      <button type="button" id="forgot-password-btn" class="link-btn">パスワードを忘れた場合</button>
      <p id="login-message" class="hint"></p>
    </form>

    <!-- 新規登録フォーム -->
    <form id="register-form" class="auth-form hidden">
      <label>メールアドレス
        <input type="email" id="register-email" required autocomplete="email">
      </label>
      <label>パスワード（6文字以上）
        <input type="password" id="register-password" required autocomplete="new-password" minlength="6">
      </label>
      <label>パスワード（確認）
        <input type="password" id="register-password-confirm" required autocomplete="new-password">
      </label>
      <button type="submit" class="primary-btn">登録する</button>
      <p id="register-message" class="hint"></p>
    </form>
  </div>
</div>

<main>
  <section class="panel list-panel">
    <div class="list-header">
      <h2>Disaster List</h2>
      <button type="button" id="toggle-list" class="toggle-btn" aria-expanded="true" title="一覧を折りたたむ">◀</button>
    </div>

    <div id="list-body">
      <button type="button" id="open-new-report" class="primary-btn">＋ 新規登録</button>

      <div class="filter-bar">
        <span class="filter-label">表示：</span>
        <label><input type="checkbox" class="status-filter" value="未対応" checked> 未対応</label>
        <label><input type="checkbox" class="status-filter" value="対応中" checked> 対応中</label>
        <label><input type="checkbox" class="status-filter" value="対応済み"> 対応済み</label>
      </div>

      <table id="report-table">
        <thead>
          <tr>
            <th>No.</th>
            <th>報告時刻</th>
            <th>画像</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel map-panel">
    <h2>Map</h2>
    <div id="map"></div>
  </section>
</main>

<!-- 新規登録モーダル -->
<div id="new-report-modal" class="modal-overlay hidden">
  <div class="modal">
    <button type="button" class="modal-close" data-close="new-report-modal">×</button>
    <h2>新規報告</h2>
    <form id="report-form">
      <label>
        画像（位置情報付き写真）
        <input type="file" name="image" id="image-input" accept="image/*" required>
      </label>
      <p id="gps-status" class="hint"></p>

      <div class="location-actions">
        <button type="button" id="use-current-location" class="secondary-btn">📍 現在地を取得</button>
        <button type="button" id="toggle-picker" class="link-btn">🗺️ 地図で位置を修正する</button>
      </div>
      <p id="location-status" class="hint"></p>

      <div id="location-picker" class="hidden">
        <div id="picker-map"></div>
        <p class="hint picker-hint">マーカーをドラッグ、または地図をタップして位置を指定</p>
        <button type="button" id="apply-picker-coords" class="primary-btn">📍 この位置を使用</button>
      </div>

      <label>
        報告時刻
        <input type="datetime-local" name="reported_at" id="reported-at-input" required>
      </label>

      <label>
        被害情報
        <textarea name="damage_info" id="damage-info-input" rows="3" required placeholder="例：建物倒壊、道路冠水など"></textarea>
      </label>

      <label>
        対応状況
        <select name="status" id="status-input">
          <option value="未対応">未対応</option>
          <option value="対応中">対応中</option>
          <option value="対応済み">対応済み</option>
        </select>
      </label>

      <button type="submit" id="submit-button" class="primary-btn">報告を登録</button>
      <p id="form-message" class="hint"></p>
    </form>
  </div>
</div>

<!-- 詳細モーダル -->
<div id="detail-modal" class="modal-overlay hidden">
  <div class="modal">
    <button type="button" class="modal-close" data-close="detail-modal">×</button>
    <h2>Details</h2>
    <div id="detail-content"></div>

    <h3>対応状況の更新</h3>
    <form id="status-update-form">
      <label>
        新しい対応状況
        <select id="status-update-select">
          <option value="未対応">未対応</option>
          <option value="対応中">対応中</option>
          <option value="対応済み">対応済み</option>
        </select>
      </label>
      <label>
        メモ（任意）
        <textarea id="status-update-note" rows="2" placeholder="対応内容など"></textarea>
      </label>
      <label>
        画像（任意）
        <input type="file" id="status-image-input" accept="image/*">
      </label>
      <button type="submit" id="status-update-submit" class="primary-btn">対応状況を追加</button>
      <p id="status-update-message" class="hint"></p>
    </form>

    <h3>対応履歴</h3>
    <ul id="status-history-list"></ul>

    <button type="button" id="delete-report-btn" class="danger-btn">この報告を削除</button>
  </div>
</div>

<!-- お知らせ送信モーダル -->
<div id="alert-modal" class="modal-overlay hidden">
  <div class="modal">
    <button type="button" class="modal-close" data-close="alert-modal">×</button>
    <h2>お知らせを送信</h2>
    <p class="hint">登録されている全ユーザーにメールで通知が送られます。</p>
    <form id="alert-form">
      <label>
        メッセージ
        <textarea id="alert-message" rows="4" required placeholder="例：大雨警報が発令されました。被害状況の報告をお願いします。"></textarea>
      </label>
      <button type="submit" id="send-alert-btn" class="primary-btn">送信する</button>
      <p id="alert-form-message" class="hint"></p>
    </form>
  </div>
</div>

<!-- ライトボックス -->
<div id="lightbox" class="lightbox-overlay hidden">
  <div class="lightbox-inner">
    <button type="button" class="lightbox-nav lightbox-prev">&#8249;</button>
    <img id="lightbox-img" src="" alt="">
    <button type="button" class="lightbox-nav lightbox-next">&#8250;</button>
  </div>
  <button type="button" class="lightbox-close">×</button>
  <div id="lightbox-counter" class="lightbox-counter"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
